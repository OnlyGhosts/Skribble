# Deploys the game server to Fly.io: one always-on machine in London (see fly.toml).
#
# Runs once the FLY_API_TOKEN repository secret exists: an org token from the Fly dashboard
# (your organization, then Tokens). The first run creates the app named in fly.toml. Only pushes
# that change the server deploy: a deploy restarts the process and ends the rooms in progress,
# and client-only changes ship through Vercel without touching it.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: No Fly token yet
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN is not set, so there is nothing to deploy to."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Create the app on the first run
        if: env.FLY_API_TOKEN != ''
        run: |
          app=$(sed -nE 's/^app *= *"([^"]+)".*/\1/p' fly.toml)
          if flyctl status --app "$app" > /dev/null 2>&1; then
            echo "$app exists"
          else
            flyctl apps create "$app" --org personal
          fi
      - name: Deploy one machine
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false
      # Rooms live in the machine's memory: a second machine would split them.
      - name: Keep exactly one machine
        if: env.FLY_API_TOKEN != ''
        run: flyctl scale count 1 --yes
      # A new app needs public addresses before boredgames-io.fly.dev answers (free: shared IPv4, IPv6).
      - name: Public addresses
        if: env.FLY_API_TOKEN != ''
        run: |
          if [ "$(flyctl ips list --json | jq 'length')" = "0" ]; then
            flyctl ips allocate-v4 --shared
            flyctl ips allocate-v6
          fi
          flyctl ips list
