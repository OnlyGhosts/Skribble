    <title>boredgames.io</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colours.
      (function () {
        // Dark is the brand default; the toggle's choice is remembered in localStorage.
        var theme = 'dark';
        try {
          var prefs = JSON.parse(localStorage.getItem('boredgames.prefs') || 'null');
          if (prefs && (prefs.theme === 'dark' || prefs.theme === 'light')) theme = prefs.theme;
        } catch (e) {
          /* storage unavailable */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
