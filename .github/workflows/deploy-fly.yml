# Deploys to Fly.io on every push to main once the FLY_API_TOKEN repository secret exists.
# Setup (once): `fly launch --copy-config --no-deploy` locally, then `fly tokens create deploy -x 999999h`
# and add the token as the FLY_API_TOKEN secret in the repository settings.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FLY_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
