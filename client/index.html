<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6c5ce7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Skribble — draw and guess with friends. Share a 4-character code and play instantly." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Skribble — draw &amp; guess with friends</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colours.
      (function () {
        var theme = 'light';
        try {
          var prefs = JSON.parse(localStorage.getItem('skribble.prefs') || 'null');
          if (prefs && (prefs.theme === 'dark' || prefs.theme === 'light')) theme = prefs.theme;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {
          /* storage unavailable */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
