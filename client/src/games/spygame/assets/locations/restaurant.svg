<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="restaurant">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(20 72% 62%)"/>
      <stop offset="1" stop-color="hsl(60 68% 38%)"/>
    </linearGradient>
    <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="6" cy="6" r="2.2" fill="hsl(20 90% 96% / 0.22)"/>
    </pattern>
    <radialGradient id="h" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g)"/>
  <rect width="400" height="300" fill="url(#p)"/>
  <circle cx="200" cy="165" r="120" fill="url(#h)"/>
  <text x="200" y="160" font-size="150" text-anchor="middle" dominant-baseline="central" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🍽️</text>
