    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bored Games</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colours.
      (function () {
        var theme = 'light';
        try {
          var prefs = JSON.parse(localStorage.getItem('boredgames.prefs') || 'null');
          if (prefs && (prefs.theme === 'dark' || prefs.theme === 'light')) theme = prefs.theme;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {
          /* storage unavailable */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
