# Deploys the game server to Fly.io: one always-on machine in London (see fly.toml).
#
# Runs once the FLY_API_TOKEN repository secret exists: an org token from the Fly dashboard
# (your organization, then Tokens). The first run creates the app named in fly.toml. Only pushes
# that change the server deploy: a deploy restarts the process (the games in progress carry on
# from the checkpoints the phones hold), and client-only changes ship through Vercel without
# touching it.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: No Fly token yet
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN is not set, so there is nothing to deploy to."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Create the app on the first run
        if: env.FLY_API_TOKEN != ''
        run: |
          app=$(sed -nE 's/^app *= *"([^"]+)".*/\1/p' fly.toml)
          if flyctl status --app "$app" > /dev/null 2>&1; then
            echo "$app exists"
          else
            flyctl apps create "$app" --org personal
          fi
      # The key that seals the room checkpoints the phones hold, so games carry on after a restart.
      # Made once and never changed (a new key only makes the checkpoints out there fail, and those
      # games end as they did before). The value is masked and never printed.
      - name: Room checkpoint key
        if: env.FLY_API_TOKEN != ''
        run: |
          # A failed or unexpected listing stops the deploy rather than replacing a key that exists.
          secrets=$(flyctl secrets list --json)
          printf '%s' "$secrets" | jq -e 'type == "array" or . == null' > /dev/null
          found=$(printf '%s' "$secrets" | jq '[.[]? | (.Name // .name // "") | ascii_upcase | select(. == "ROOM_CHECKPOINT_KEY")] | length')
          if [ "$found" != "0" ]; then
            echo "ROOM_CHECKPOINT_KEY is set"
          else
            key=$(openssl rand -base64 32)
            echo "::add-mask::$key"
            flyctl secrets set "ROOM_CHECKPOINT_KEY=$key" --stage > /dev/null
            echo "ROOM_CHECKPOINT_KEY created"
          fi
      - name: Deploy one machine
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false
      # Rooms live in the machine's memory: a second machine would split them.
      - name: Keep exactly one machine
        if: env.FLY_API_TOKEN != ''
        run: flyctl scale count 1 --yes
      # A new app needs public addresses before boredgames-io.fly.dev answers (free: shared IPv4, IPv6).
      - name: Public addresses
        if: env.FLY_API_TOKEN != ''
        run: |
          if [ "$(flyctl ips list --json | jq 'length')" = "0" ]; then
            flyctl ips allocate-v4 --shared
            flyctl ips allocate-v6
          fi
          flyctl ips list
