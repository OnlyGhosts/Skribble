# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service built from the Dockerfile. The free plan supports WebSockets.
services:
  - type: web
    name: skribble
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
